# ── Kubernetes profile: replaces Eureka with K8s-native service discovery ──
# Activate with: SPRING_PROFILES_ACTIVE=kubernetes
#
# Every other service already had this file. Without it, distribution-service ran in
# the cluster with the `kubernetes` profile active and Eureka still enabled, pointing
# at a Eureka the rest of the platform had stopped registering with.

eureka:
  client:
    enabled: false

spring:
  cloud:
    discovery:
      enabled: true
    kubernetes:
      discovery:
        enabled: true
        all-namespaces: false
      config:
        enabled: false
      reload:
        enabled: false
