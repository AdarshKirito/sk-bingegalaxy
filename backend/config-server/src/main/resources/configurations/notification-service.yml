server:
  port: 8085
  # ── DoS / resource-exhaustion hardening ──────────────────────────────
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 256KB
    max-swallow-size: 2MB
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:5000}
    keep-alive-timeout: ${TOMCAT_KEEP_ALIVE_TIMEOUT:20000}

spring:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  application:
    name: notification-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/notification_db}
      # Spring Boot 3 defaults this to false, which silently disabled every
      # @Indexed/@CompoundIndex — including the 90-day PII TTL on notifications
      # and the unique reminder-dedup index. MongoIndexBootstrap additionally
      # ensures the indexes deterministically at startup.
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      # Wrap the JSON deserializers in ErrorHandlingDeserializer so a single poison/
      # unparseable record can NEVER block a partition forever (it is logged + skipped
      # as a null value instead of the container looping on the same offset). The real
      # deserializers are delegated below.
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.skbingegalaxy.*
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      observation-enabled: true
      # ── Durability hardening ─────────────────────────────
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        linger.ms: 5
    listener:
      observation-enabled: true
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    template:
      observation-enabled: true
  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER:}
    password: ${EMAIL_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

app:
  notification:
    from-email: ${EMAIL_FROM:noreply@skbingegalaxy.com}
    from-name: SK Binge Galaxy
    max-retries: ${NOTIFICATION_MAX_RETRIES:3}
    retry-interval-ms: ${NOTIFICATION_RETRY_INTERVAL_MS:300000}
    # Guards SMTP from bulk-cancel storms. 100/min ≈ 1.7/s — enough for normal
    # traffic; Kafka consumer threads back off when exceeded (30s wait then drop).
    # Raise via EMAIL_RATE_PER_MINUTE env if SMTP provider allows higher throughput.
    email-rate-limit-per-minute: ${EMAIL_RATE_PER_MINUTE:100}
    # Shared secret for the provider delivery webhook (/api/v1/notifications/webhooks/delivery).
    # The sender signs the raw request body with HMAC-SHA256 and puts the lowercase hex digest
    # in X-Webhook-Signature. REQUIRED for delivery callbacks to work: the endpoint is publicly
    # routed through the gateway and fail-closed rejects everything when this is unset.
    webhook-secret: ${NOTIFICATION_WEBHOOK_SECRET:}
  sms:
    provider: ${SMS_PROVIDER:disabled}
    api-key: ${SMS_API_KEY:}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:disabled}
    phone-id: ${WHATSAPP_PHONE_ID:}
    token: ${WHATSAPP_TOKEN:}
  # ── Browser Web Push (VAPID / RFC-8291) ──────────────────────────────
  # The PUBLIC key is served to browsers as their applicationServerKey and must stay
  # STABLE for the life of a deployment — rotating it invalidates every existing
  # subscription. The PRIVATE key is a secret and deliberately has NO default:
  # boot fails if WEBPUSH_PRIVATE_KEY is unset, the same fail-fast contract as
  # JWT_SECRET (a committed fallback key would silently sign production pushes).
  # Generate a pair once with `npx web-push generate-vapid-keys` and set both
  # vars in the environment (.env for compose, secret sync for k8s).
  webpush:
    public-key: ${WEBPUSH_PUBLIC_KEY}
    private-key: ${WEBPUSH_PRIVATE_KEY}
    subject: ${WEBPUSH_SUBJECT:mailto:noreply@skbingegalaxy.com}

logging:
  level:
    root: INFO
    com.skbingegalaxy.notification: WARN

# ── Resilience4j Circuit Breaker ─────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 10s
        slow-call-rate-threshold: 80
        register-health-indicator: true
    instances:
      smtp:
        base-config: default
      sms:
        base-config: default
      push:
        base-config: default

eureka:
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
        probability: ${TRACING_SAMPLING:0.10}
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411/api/v2/spans}
