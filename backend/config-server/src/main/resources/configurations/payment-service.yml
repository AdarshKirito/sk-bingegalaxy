server:
  port: 8084
  # ── DoS / resource-exhaustion hardening ──────────────────────────────
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 256KB
    max-swallow-size: 2MB
    connection-timeout: ${TOMCAT_CONNECTION_TIMEOUT:5000}
    keep-alive-timeout: ${TOMCAT_KEEP_ALIVE_TIMEOUT:20000}

internal:
  api:
    # No default — boot fails fast if the shared Feign secret is not
    # provided via env, rather than silently running with a well-known
    # placeholder that would let anyone forge internal API calls.
    secret: ${INTERNAL_API_SECRET}

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:payment_svc}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:8}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:2}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1800000}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:5000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:3000}
      leak-detection-threshold: ${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:60000}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:0}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jakarta.persistence.query.timeout: ${JPA_QUERY_TIMEOUT_MS:10000}
        jdbc.time_zone: UTC
        # ── JDBC batching — collapse N inserts/updates into single round-trips.
        jdbc.batch_size: ${HIBERNATE_JDBC_BATCH_SIZE:50}
        jdbc.batch_versioned_data: true
        jdbc.fetch_size: ${HIBERNATE_JDBC_FETCH_SIZE:100}
        order_inserts: true
        order_updates: true
        query.in_clause_parameter_padding: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      observation-enabled: true
      # ── Durability hardening ─────────────────────────────
      # acks=all  → wait for all in-sync replicas (no silent loss if leader crashes)
      # retries   → retry transient broker errors
      # idempotence → broker deduplicates on retry (no duplicates when combined with retries)
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        linger.ms: 5
    consumer:
      group-id: payment-group
      auto-offset-reset: earliest
      # ErrorHandlingDeserializer wrap — a poison record must never block a
      # partition forever (see booking-service.yml for the full rationale).
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.skbingegalaxy.*
    listener:
      observation-enabled: true
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}
    template:
      observation-enabled: true

app:
  payment:
    currency: INR
    callback-url: ${PAYMENT_CALLBACK_URL}
    simulation-enabled: ${PAYMENT_SIMULATION_ENABLED:false}
    settlement-reconciliation-cron: ${SETTLEMENT_RECONCILIATION_CRON:0 0 3 * * *}
    settlement-reconciliation-zone: ${SETTLEMENT_RECONCILIATION_ZONE:Asia/Kolkata}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    # Webhook secret for verifying Razorpay dispute/chargeback webhooks.
    # Generate in Razorpay Dashboard → Settings → Webhooks → <webhook> → Secret.
    # REQUIRED for dispute handling to work. Without this, all dispute webhooks
    # are rejected with 403 to prevent spoofed chargebacks from corrupting state.
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  # ── Stripe Connect ──────────────────────────────────────────────────────
  # Venues are onboarded as Express connected accounts and charged with DIRECT
  # charges, so the charge happens on the venue's account in the venue's country.
  # That is what lets a customer anywhere pay an Indian venue by UPI.
  # Leave secret-key empty to keep Stripe dormant: StripePaymentProvider then
  # advertises no currencies and the registry never routes to it.
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    # Publishable key (pk_…) — returned to the browser to initialise Stripe.js.
    # Safe to expose; the secret key never leaves the server.
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    # Developers → Webhooks → <endpoint> → Signing secret (whsec_…).
    # REQUIRED for Connect to work: without it every webhook is rejected 403,
    # so accounts never flip to chargeable after KYC.
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # Platform commission in basis points (100 = 1%), taken as application_fee_amount.
    application-fee-bps: ${STRIPE_APPLICATION_FEE_BPS:0}
    # Where Stripe returns the venue owner after hosted onboarding.
    onboarding-return-url: ${STRIPE_ONBOARDING_RETURN_URL:http://localhost:5173/admin/binges}
    onboarding-refresh-url: ${STRIPE_ONBOARDING_REFRESH_URL:http://localhost:5173/admin/binges}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

logging:
  level:
    root: INFO
    com.skbingegalaxy.payment: WARN

# ── Resilience4j Circuit Breaker ─────────────────────────
spring.cloud.openfeign.circuitbreaker.enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 5s
        slow-call-rate-threshold: 80
        register-health-indicator: true
    instances:
      booking-service:
        base-config: default
      razorpay:
        base-config: default
        wait-duration-in-open-state: 60s
        slow-call-duration-threshold: 10s
      stripe:
        base-config: default
        wait-duration-in-open-state: 60s
        slow-call-duration-threshold: 10s
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - feign.RetryableException
    instances:
      booking-service:
        base-config: default
      razorpay:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
  timelimiter:
    configs:
      default:
        timeout-duration: 5s

eureka:
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    sampling:
        probability: ${TRACING_SAMPLING:0.10}
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411/api/v2/spans}
